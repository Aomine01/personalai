<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');

@page {
  size: A4 portrait;
  margin: 15mm;
}

body {
  font-family: 'Inter', Helvetica, sans-serif;
  background-color: #f8fafc;
  color: #1e293b;
  margin: 0;
  padding: 0;
}

.card {
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  border: 1px solid #e2e8f0;
  padding: 24px;
  margin-top: 10px;
}

.header {
  border-bottom: 2px solid #3b82f6;
  padding-bottom: 12px;
  margin-bottom: 20px;
}

.title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 20pt;
  color: #1e3a8a;
  margin: 0 0 6px 0;
}

.subtitle {
  font-size: 9pt;
  color: #64748b;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 1px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th {
  background-color: #1e3a8a;
  color: #ffffff;
  font-weight: 600;
  font-size: 10pt;
  text-align: left;
  padding: 10px 12px;
  border: 1px solid #cbd5e1;
}

td {
  padding: 10px 12px;
  font-size: 9.5pt;
  border: 1px solid #cbd5e1;
  color: #334155;
}

tr:nth-child(even) td {
  background-color: #f8fafc;
}

.footer {
  margin-top: 24px;
  text-align: center;
  font-size: 8pt;
  color: #94a3b8;
  border-top: 1px solid #e2e8f0;
  padding-top: 12px;
}
</style>
<title>Table Snapshot</title>
</head>
<body>
<div class="card">
  <div class="header">
    <h1 class="title">{{ title }}</h1>
    <p class="subtitle">Tabular Data Overview</p>
  </div>
  <table>
    <thead>
      <tr>
        {% for header in headers %}
        <th>{{ header }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        {% for cell in row %}
        <td>{{ cell }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="footer">
    Generated by AI Agent · {{ generated_at }}
  </div>
</div>
</body>
</html>
